name: Reps
options:
  bundleIdPrefix: com.danipina
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  Reps:
    type: application
    platform: iOS
    sources:
      - Reps
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Reps
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danipina.reps
        DEVELOPMENT_TEAM: RW46NLF44W
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  RepsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RepsTests
    dependencies:
      - target: Reps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danipina.reps.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: RW46NLF44W
schemes:
  Reps:
    build:
      targets:
        Reps: all
    test:
      targets:
        - RepsTests
